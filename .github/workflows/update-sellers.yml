name: Update Mediavine Ecosystem Sellers Feed

on:
  schedule:
    # Runs daily at 07:00 UTC
    - cron: '0 7 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-feed:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run daily diff job
        id: update
        run: |
          python scripts/update_sellers.py

      - name: Commit and push changes
        if: steps.update.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "actions@users.noreply.github.com"
          git add data/*.csv docs/*.csv data/last_run.json docs/last_run.json
          git commit -m "${{ steps.update.outputs.summary }}"
          git push

